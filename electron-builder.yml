# Deliberately still the name the app first shipped under. Windows keys an
# installed program to its appId: change it and the installer stops seeing the
# existing install, so an upgrade lands as a second copy in Add or remove
# programs instead of replacing the first. Survived the rename to Work Suite
# for the same reason, and survives this one.
appId: com.fieldbase.desktop
productName: Matlock One
copyright: Copyright © 2026 Matlock Software

directories:
  output: dist-installer
  buildResources: build

# Only the launcher goes in the asar. The server and its dependencies are
# extraResources because a Node process cannot require() out of an archive.
#
# The exclusion is not redundant: electron-builder packs every production
# dependency in package.json regardless of what this list says, and that put
# 438 MB of node_modules into the archive beside 0.1 MB of launcher — roughly
# doubling the installer. Nothing in electron/ requires any of them from inside
# Electron. better-sqlite3 looks like a counter-example and is not: init-db.js
# runs under the bundled Node in resources/server, against that folder's own
# copy, precisely because a native module built for Node cannot load in
# Electron's different ABI.
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
  # …except electron-updater, which the launcher itself loads. Listed rather
  # than left to electron-builder's "include every production dependency"
  # default, because that default is what put 438 MB in here. 2.3 MB.
  # If this list ever goes stale the launcher still starts: electron/updater.js
  # treats a missing module as "updates unavailable" rather than crashing.
  - "node_modules/{argparse,builder-util-runtime,debug,electron-updater,fs-extra,graceful-fs,js-yaml,jsonfile,lazy-val,lodash.escaperegexp,lodash.isequal,ms,sax,semver,tiny-typed-emitter,universalify}/**/*"

# NOTE: the destination must not be `app` — Electron reserves `resources/app`
# for an unpacked application directory and will not copy a payload there.
# The server bundle and Node runtime are copied by scripts/after-pack.cjs
# rather than declared here: electron-builder applies its own ignore patterns
# to extraResources and silently drops node_modules and dot-directories.
afterPack: scripts/after-pack.cjs

# Nothing in the launcher is a native module, so there is nothing to rebuild —
# the server's native SQLite binding ships prebuilt in extraResources against
# the Node binary bundled beside it.
npmRebuild: false

asar: true
compression: maximum


# Where the app looks for new versions, and where `npm run desktop:pack`
# writes latest.yml alongside the installer.
#
# The GitHub provider rather than a generic URL: electron-updater asks the
# releases API for the newest tag instead of fetching a yml from a fixed path,
# so there is no download host to run and no DNS to keep pointing at it. The
# previous generic URL named downloads.matlocksoftware.com, which has never
# resolved — a feed the installed app would have polled forever without
# finding an update.
#
# electron-builder tags each release `v${version}` and uploads the installer,
# its blockmap and latest.yml together; the app reads the yml, compares
# versions, and checks the installer's SHA-512 against it before running
# anything.
#
# The repository must be PUBLIC for any of this to work. GitHub serves a
# private repository's release assets only to an authenticated token — which
# an installed copy does not carry, and a visitor to the download page
# certainly does not. A private repo here means both the update check and the
# download button 404.
publish:
  - provider: github
    owner: JLMattyice
    repo: matlockone

win:
  icon: build/icon.ico
  # The Publisher shown in Add or remove programs, and the company name in the
  # executable's version resource, both come from `author` in package.json.
  # electron-builder 26 moved `publisherName` under signtoolOptions, where it
  # only checks a certificate's subject — it is not the display name.
  #
  # Neither makes Windows call the download trusted: the "Verified publisher"
  # line on SmartScreen and UAC comes only from an Authenticode signature,
  # which needs a purchased code-signing certificate. Unsigned still warns.
  target:
    - target: nsis
      arch: [x64]
  artifactName: MatlockOne-Setup-${version}.${ext}

# Building this requires a Mac: the SQLite binding is a native module and
# cannot be cross-compiled, and only macOS can produce a .icns and sign the
# bundle. Everything else in the launcher is already platform-neutral.
#
# Distribution is direct download from the site, the way Claude and every other
# non-store Mac app ships it. That means Developer ID plus notarization, not a
# Mac App Store submission — a different certificate and no App Sandbox.
mac:
  icon: build/icon.png
  category: public.app-category.business

  # No architecture here, on purpose. The bundled Node and the SQLite binding
  # are native, so the app can only ever be built for the architecture of the
  # machine running the build — scripts/after-pack.cjs refuses anything else.
  # With no arch on the target, electron-builder uses exactly that: the one
  # given on the command line, or the host's own when none is.
  #
  # Pinning one here does not do what it looks like. This used to read
  # `arch: [arm64]`, with a note that an Intel Mac could build with --x64. It
  # cannot: electron-builder seeds its arch list from the command line and then
  # adds each target's own arch on top (computeArchToTargetNamesMap in
  # app-builder-lib), so --x64 did not replace arm64 — it built both. The x64
  # app packed, signed and notarized; the arm64 one then reached after-pack and
  # was rightly refused, and the build ended with a notarized app and no DMG.
  #
  # zip alongside dmg because electron-updater updates macOS from the zip. The
  # DMG is what a person downloads; the zip is what an installed copy updates
  # itself from, and without it every Mac install is stranded on its first
  # version.
  target:
    - dmg
    - zip

  # Space-free, and carrying the architecture. GitHub rewrites spaces in
  # release asset names as dots, so the productName default ("Matlock One-…")
  # uploads as "Matlock.One-…" while latest-mac.yml still names the original,
  # and the updater asks for a file that is not there. The arch keeps an Intel
  # and an Apple Silicon build from overwriting each other on one release.
  artifactName: MatlockOne-${version}-${arch}.${ext}

  # Required for notarization, and the reason build/entitlements.mac.plist
  # exists — the hardened runtime blocks the JIT, the inherited environment and
  # the native SQLite binding unless each is asked for explicitly.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

  # The bundle is signed but not yet stapled at this point, so Gatekeeper would
  # reject its own assessment. Notarization is what makes it pass.
  gatekeeperAssess: false

  # Signing identity is discovered from the keychain: the "Developer ID
  # Application" certificate. `identity: null` used to sit here and explicitly
  # disabled signing — removing it is what turns signing on.
  #
  # Notarization reads credentials from the environment, so nothing secret is
  # committed. Either an App Store Connect API key:
  #   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
  # or an Apple ID with an app-specific password:
  #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  # For an unsigned smoke-test build, set CSC_IDENTITY_AUTO_DISCOVERY=false and
  # notarization is skipped with it.
  notarize: true

dmg:
  title: Matlock One

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Matlock One
  # Business records live in the user's app data folder, never beside the
  # program, so uninstalling never takes a customer's data with it.
  deleteAppDataOnUninstall: false
